<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>方休 · 特调</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:#f2f3f5;color:#333;
}
/* 全屏分屏容器 */
.screen{
  position:absolute;width:100vw;height:100vh;
  opacity:0;pointer-events:none;transition:opacity 1.4s ease;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:2rem;
}
.screen.active{opacity:1;pointer-events:auto;z-index:10;}

/* 开场屏幕 */
#screen-intro{background:linear-gradient(145deg,#eceef1,#e4e7eb);position:relative;}
/* 雪花粒子 */
.snow{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;overflow:hidden;}
.snow-dot{
  position:absolute;background:#fff;border-radius:50%;opacity:0.25;
  animation:snowfall 8s linear infinite;
}
@keyframes snowfall{
  0%{transform:translateY(-20px);}
  100%{transform:translateY(105vh);}
}
/* 薄雾蒙层 */
.fog{
  position:absolute;inset:0;background:rgba(180,184,192,0);
  transition:background 2.8s ease;pointer-events:none;
}
.fog.on{background:rgba(180,184,192,0.35);}

/* 酒杯 */
.glass-wrap{position:relative;width:180px;height:260px;margin-bottom:40px;}
.glass{
  width:140px;height:180px;border:2px solid #c8cdd4;
  border-bottom:none;border-radius:0 0 24px 24px;
  position:relative;overflow:hidden;background:rgba(255,255,255,0.08);
}
.liquid{
  position:absolute;bottom:0;left:0;width:100%;height:0;
  background:linear-gradient(0deg,rgba(234,210,170,0.42),rgba(248,234,212,0.12));
  transition:height 2.2s ease;
}
.glass-shake{animation:shakeGlass 0.7s ease-in-out infinite alternate;}
@keyframes shakeGlass{
  0%{transform:rotate(-1.6deg);}
  100%{transform:rotate(1.6deg);}
}
/* 兰花：淡肉橘+淡金色 */
.orchid{
  width:52px;height:52px;position:absolute;top:-80px;left:44px;
  background:radial-gradient(circle,#f8c7b2,#e6bc88);
  border-radius:50%;opacity:0;
}
.orchid.fall{animation:fallOrchid 2.4s ease forwards;opacity:1;}
@keyframes fallOrchid{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(130px) rotate(140deg);}
}
.orchid.float{animation:audioFloat 1.2s ease-in-out infinite alternate;}
@keyframes audioFloat{
  0%{transform:translateY(126px) scale(0.94);}
  100%{transform:translateY(142px) scale(1.06);}
}

/* 命名文字 */
.title-name{opacity:0;transition:opacity 1.6s ease;text-align:center;margin-bottom:12px;}
.title-name.show{opacity:1;}
.main-txt{font-size:2.2rem;font-weight:300;color:#444;margin-bottom:8px;}
.sub-rus{font-size:1.1rem;color:#666;letter-spacing:1px;}

/* 昵称输入框-签单质感 */
.nick-box{
  margin-top:28px;padding:22px 28px;border:1px solid #b8bdc4;
  border-radius:10px;background:rgba(255,255,255,0.64);
  opacity:0;transition:opacity 1.4s ease;
}
.nick-box.show{opacity:1;}
.nick-tip{font-size:0.95rem;color:#555;margin-bottom:10px;}
#nickInput{
  padding:8px 10px;width:240px;border:1px solid #c2c7cf;border-radius:6px;
  background:#fff;font-size:0.95rem;outline:none;
}
#btnConfirmNick{
  margin-left:10px;padding:8px 16px;border:none;border-radius:6px;
  background:#4a505a;color:#fff;cursor:pointer;
}
/* 酒杯上浮昵称金色文字 */
.glass-nick-tag{
  position:absolute;top:-32px;left:50%;transform:translateX(-50%);
  color:#d4b278;font-size:1.2rem;opacity:0;transition:opacity 1.2s;
}
.glass-nick-tag.show{opacity:1;}

/* 书本屏幕 */
#screen-book{background:#f2f3f5;}
.book-wrap{
  width:840px;max-width:94vw;display:flex;gap:2px;perspective:1400px;
}
.book-page{
  width:50%;min-height:440px;padding:2rem 1.8rem;
  background:#fff;border-radius:12px;position:relative;
  /*书页冷霜雾边*/
  box-shadow:inset 0 0 24px rgba(182,186,194,0.28);
}
.book-left{border-right:1px solid #e2e4e8;}
.book-right{}
.profile-item{margin-bottom:8px;font-size:0.98rem;color:#444;}
.tune-block{margin-bottom:18px;}
.tune-hd{font-weight:500;margin-bottom:6px;color:#3a3e46;}
.tune-tags{font-size:0.94rem;color:#555;line-height:1.7;}

/* 折叠纸条-须知 */
.fold-note{
  margin-top:32px;width:620px;max-width:92vw;
  background:#fff;border-radius:8px;border:1px solid #d8dbe2;
  overflow:hidden;
}
.note-hd{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.note-body{
  max-height:0;overflow:hidden;transition:max-height 1.1s ease;padding:0 16px;
}
.note-body.open{max-height:600px;padding-bottom:16px;}
.note-text{font-size:0.9rem;line-height:1.7;color:#444;white-space:pre-line;}

#btnConfirmOrder{
  margin-top:22px;padding:10px 22px;border:none;border-radius:7px;background:#444;color:#fff;cursor:pointer;
}

/* 签名收尾屏幕 */
#screen-end{background:#eceef1;}
.signature{
  font-size:3.4rem;font-style:italic;color:#b89660;
  opacity:0;transform:translateY(24px);transition:all 1.6s ease;
}
.signature.show{opacity:1;transform:translateY(0);}
</style>
</head>
