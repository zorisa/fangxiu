<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>特调·方休</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-weight:300;}
body{
  background:#f0f1f3;
  color:#44474c;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow-x:hidden;
  line-height:1.7;
}
/* 全局磨砂层 */
.frost{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
/* 开篇全屏动画容器 */
#opening{
  width:100vw;height:100vh;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#e8eaed,#f3f4f6);
  overflow:hidden;
}
.liquid{
  position:absolute;bottom:30%;left:50%;transform:translateX(-50%);
  width:80px;height:0px;
  background:linear-gradient(180deg,rgba(220,224,230,0.6),rgba(190,196,205,0.4));
  border-radius:0 0 40px 40px;
  animation: pour 4s ease-out forwards;
}
@keyframes pour{
  0%{height:0;opacity:0.8}
  100%{height:110px;opacity:0.65}
}
.orchid{
  position:absolute;left:50%;top:20%;transform:translateX(-50%);
  width:36px;height:36px;
  opacity:0;
  animation: fall 5s ease-in-out forwards, sway 3s ease-in-out infinite alternate;
}
@keyframes fall{
  0%{top:20%;opacity:0}
  40%{opacity:0.7}
  100%{top:calc(30% + 90px);opacity:0.6}
}
@keyframes sway{
  0%{transform:translateX(-50%) rotate(-4deg)}
  100%{transform:translateX(-50%) rotate(4deg)}
}
.glass{
  position:absolute;left:50%;bottom:22%;transform:translateX(-50%);
  width:100px;height:140px;
  border:1px solid rgba(160,166,175,0.4);
  border-top:none;
  border-radius:0 0 50px 50px;
  opacity:0.55;
}
.title-text{
  position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  animation: fadeIn 2s ease forwards 4s;
  font-size:24px;letter-spacing:2px;
}
.sub-ru{
  font-size:14px;
  opacity:0.45;
  margin-top:8px;
  animation: fadeIn 2s ease forwards 5s;
}
@keyframes fadeIn{
  from{opacity:0;transform:translate(-50%,-45%)}
  to{opacity:1;transform:translate(-50%,-50%)}
}
/* 昵称输入框 签单盖章样式 */
.name-box{
  position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
  width:320px;
  padding:24px 28px;
  border:1px solid rgba(150,156,164,0.4);
  border-radius:12px;
  background:rgba(255,255,255,0.35);
  display:none;
  animation: boxShow 1.5s ease forwards 6s;
}
@keyframes boxShow{
  from{opacity:0;transform:translateX(-50%) translateY(20px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
.name-box p{font-size:14px;margin-bottom:12px;opacity:0.7;}
.name-box input{
  width:100%;padding:10px 12px;
  border:1px solid rgba(170,176,184,0.4);
  background:rgba(255,255,255,0.5);
  border-radius:6px;
  outline:none;font-size:15px;
}
.confirm-btn{
  margin-top:14px;width:100%;padding:10px;
  border:1px solid rgba(130,136,144,0.5);
  background:rgba(240,242,245,0.6);
  border-radius:6px;
  cursor:pointer;
  transition:0.3s;
}
.confirm-btn:hover{background:rgba(228,230,234,0.75)}

/* 主内容区，默认隐藏 */
#mainWrap{display:none;padding:60px 20px;max-width:860px;margin:0 auto;}
.welcome-tip{
  text-align:center;font-size:15px;opacity:0.65;margin-bottom:30px;
  letter-spacing:1px;
}
/* 翻书容器 */
.book-wrap{
  position:relative;
  height:420px;
  margin-bottom:60px;
}
.page{
  position:absolute;width:100%;height:100%;
  padding:36px 40px;
  background:rgba(255,255,255,0.45);
  border:1px solid rgba(180,186,194,0.35);
  border-radius:14px;
  opacity:0;pointer-events:none;
  transition: all 0.6s ease;
}
.page.active{opacity:1;pointer-events:auto;z-index:2;}
.page h2{font-size:22px;letter-spacing:2px;margin-bottom:18px;}
.divider{
  width:100%;height:1px;background:rgba(160,166,174,0.35);margin:16px 0 24px;
}
.page p{font-size:15px;opacity:0.72;}
.page-nav{
  text-align:center;margin-top:12px;
}
.page-nav button{
  border:none;background:transparent;
  padding:6px 16px;cursor:pointer;
  opacity:0.6;transition:0.25s;
}
.page-nav button:hover{opacity:1}

/* 折叠须知 */
.fold-wrap{margin-bottom:60px;}
.fold-title{
  padding:12px 16px;border:1px solid rgba(170,176,184,0.35);
  border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,0.3);
}
.fold-content{
  margin-top:8px;padding:16px;border:1px solid rgba(170,176,184,0.35);
  border-radius:10px;display:none;
  background:rgba(255,255,255,0.25);
  font-size:14px;opacity:0.7;
}
/* 评价区 */
.eval-wrap{margin-bottom:60px;}
.eval-wrap h3{font-size:17px;margin-bottom:18px;opacity:0.75;}
.eval-card{
  padding:16px 20px;border:1px solid rgba(180,186,194,0.35);
  border-radius:10px;margin-bottom:14px;
  background:rgba(255,255,255,0.3);
  font-size:14px;
}
.eval-card .name{font-size:13px;opacity:0.55;margin-bottom:6px;}
